<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stran ne obstaja | Bober gozdarstvo</title>
<meta name="robots" content="noindex">
<meta name="description" content="Iskane strani ni. Na domači strani Bober gozdarstvo najdete storitve, opremo in kontakt.">
<meta name="theme-color" content="#142A1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--spruce:#142A1C;--paper:#F8F8F2;--sap:#E6CB98;--saw:#F06A1F;--lichen:#ECEEE4}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--spruce);color:var(--lichen);font:400 17px/1.6 "Public Sans",system-ui,sans-serif;padding:24px 16px}
main{max-width:34em;text-align:center}
.code{font:900 clamp(96px,22vw,180px)/.85 "Big Shoulders Display","Arial Narrow",sans-serif;color:var(--sap);margin:0}
h1{font:800 clamp(32px,6vw,48px)/1 "Big Shoulders Display","Arial Narrow",sans-serif;text-transform:uppercase;color:var(--paper);margin:12px 0 16px}
p{color:rgba(236,238,228,.8);margin:0 0 28px}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:4px;font-weight:600;text-decoration:none}
.go{background:var(--saw);color:#1a0d04}.go:hover{background:#ff7d33}
.call{color:var(--sap);box-shadow:inset 0 0 0 1.5px rgba(230,203,152,.45)}.call:hover{box-shadow:inset 0 0 0 1.5px var(--sap)}
:focus-visible{outline:3px solid var(--saw);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Te strani ni več</h1>
  <p>Morda smo jo podrli skupaj s starim drevesom. Na domači strani najdete vse storitve, opremo in kontakt.</p>
  <div class="btns">
    <a class="btn go" id="home" href="/">Na domačo stran</a>
    <a class="btn call" href="tel:+38641685867">Pokličite 041 68 58 67</a>
  </div>
</main>
<script>
/* works both on the custom domain (/) and on the GitHub Pages project path */
if (location.pathname.indexOf("/gozdarstvo_bober/") === 0) document.getElementById("home").href = "/gozdarstvo_bober/";
</script>
</body>
</html>
